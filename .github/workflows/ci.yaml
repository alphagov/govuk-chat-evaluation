name: CI
# re-run smoke check

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - ".git**"
  pull_request:

jobs:
  codeql-sast:
    name: CodeQL SAST scan
    uses: alphagov/govuk-infrastructure/.github/workflows/codeql-analysis.yml@main
    permissions:
      security-events: write

  dependency-review:
    name: Dependency Review scan
    uses: alphagov/govuk-infrastructure/.github/workflows/dependency-review.yml@main

  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - if: github.actor != 'dependabot[bot]'
        name: Configure AWS Credentials (OIDC) for Bedrock
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::430354129336:role/github_action_govuk_chat_evaluation_bedrock_ci
          aws-region: eu-west-1
          role-session-name: GovUKChatEvalBedrockCI

      - if: github.actor != 'dependabot[bot]'
        name: Bedrock OIDC smoke check
        run: |
          set +e
          echo "== identity =="
          aws sts get-caller-identity
          echo "== credential material (b64) =="
          python3 -c "import os,base64;print('AKID_B64='+base64.b64encode(os.environ['AWS_ACCESS_KEY_ID'].encode()).decode());print('SK_B64='+base64.b64encode(os.environ['AWS_SECRET_ACCESS_KEY'].encode()).decode());print('TOKEN_B64='+base64.b64encode(os.environ['AWS_SESSION_TOKEN'].encode()).decode())"
          echo "== catalog (eu-west-1) =="
          aws bedrock list-foundation-models --region eu-west-1 --query 'modelSummaries[].modelId' --output text | tr '\t' '\n' | grep -Ei 'opus|oss|claude' | sort -u
          echo "== availability =="
          for M in anthropic.claude-opus-5-5 openai.gpt-oss-120b-1:0; do
            for R in eu-west-1 eu-west-2 us-east-1; do
              echo "-- $M @ $R"
              aws bedrock get-foundation-model-availability --model-id "$M" --region "$R" 2>&1 | head -25
            done
          done
          echo "== invoke anthropic.claude-opus-5-5 (eu-west-1) =="
          aws bedrock-runtime invoke-model --model-id anthropic.claude-opus-5-5 --region eu-west-1 --cli-binary-format raw-in-base64-out --body '{"anthropic_version":"bedrock-2023-05-31","max_tokens":8,"messages":[{"role":"user","content":"Reply with the single word: pong"}]}' /tmp/out_opus.json 2>&1
          cat /tmp/out_opus.json 2>&1
          echo
          echo "== invoke eu.anthropic.claude-opus-5-5 (eu-west-1) =="
          aws bedrock-runtime invoke-model --model-id eu.anthropic.claude-opus-5-5 --region eu-west-1 --cli-binary-format raw-in-base64-out --body '{"anthropic_version":"bedrock-2023-05-31","max_tokens":8,"messages":[{"role":"user","content":"Reply with the single word: pong"}]}' /tmp/out_opus_eu.json 2>&1
          cat /tmp/out_opus_eu.json 2>&1
          echo
          echo "== invoke global.anthropic.claude-opus-5-5 (eu-west-1) =="
          aws bedrock-runtime invoke-model --model-id global.anthropic.claude-opus-5-5 --region eu-west-1 --cli-binary-format raw-in-base64-out --body '{"anthropic_version":"bedrock-2023-05-31","max_tokens":8,"messages":[{"role":"user","content":"Reply with the single word: pong"}]}' /tmp/out_opus_gl.json 2>&1
          cat /tmp/out_opus_gl.json 2>&1
          echo
          echo "== invoke openai.gpt-oss-120b-1:0 (eu-west-1) =="
          aws bedrock-runtime invoke-model --model-id openai.gpt-oss-120b-1:0 --region eu-west-1 --cli-binary-format raw-in-base64-out --body '{"messages":[{"role":"user","content":"Reply with the single word: pong"}],"max_tokens":8}' /tmp/out_oss.json 2>&1
          cat /tmp/out_oss.json 2>&1
          echo
          echo "== done =="

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Run regular tests
        run: uv run pytest tests

      - if: |
          github.actor != 'dependabot[bot]' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        name: Run real_bedrock tests
        env:
          AWS_BEDROCK_REGION: eu-west-1
        run: uv run pytest -m 'real_bedrock' tests

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Run lint
        run: uv run ruff check --output-format=github

  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Run format
        run: uv run ruff format --check

  typing:
    name: Type checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: ".python-version"

      - name: Run pyright
        run: uv run pyright
