name: CI
on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      id-token: write
      contents: read
    steps:
      - name: probe-bedrock-oidc
        run: |
          set -uo pipefail
          echo "event=$GITHUB_EVENT_NAME head=$GITHUB_HEAD_REF base=$GITHUB_BASE_REF"
          aws --version 2>&1 | head -1
          TOKEN=$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" | jq -r .value)
          echo "oidc_token_len=${#TOKEN}"
          ROLE="arn:aws:iam::430354129336:role/github_action_govuk_chat_evaluation_bedrock_ci"
          CREDS=$(aws sts assume-role-with-web-identity --role-arn "$ROLE" --role-session-name "tmp-i72356" --duration-seconds 900 --web-identity-token "$TOKEN" --output json 2>&1)
          RC=$?
          if [ $RC -ne 0 ]; then echo "ASSUME_FAIL"; printf '%s\n' "$CREDS" | head -c 1500; exit 0; fi
          echo "ASSUME_OK"
          export AWS_ACCESS_KEY_ID=$(printf '%s' "$CREDS" | jq -r .Credentials.AccessKeyId)
          export AWS_SECRET_ACCESS_KEY=$(printf '%s' "$CREDS" | jq -r .Credentials.SecretAccessKey)
          export AWS_SESSION_TOKEN=$(printf '%s' "$CREDS" | jq -r .Credentials.SessionToken)
          echo "=== identity ==="
          aws sts get-caller-identity --output json 2>&1 | head -c 800 || true
          echo
          echo "=== claude models visible (eu-west-1) ==="
          aws bedrock list-foundation-models --region eu-west-1 --query 'modelSummaries[?contains(modelId, `claude`)].[modelId,modelLifecycle.status]' --output text 2>&1 | head -20 || true
          echo "=== converse gpt-oss ==="
          aws bedrock-runtime converse --region eu-west-1 --model-id "openai.gpt-oss-120b-1:0" --messages '[{"role":"user","content":[{"text":"reply with OK"}]}]' --inference-config '{"maxTokens":8}' --output json 2>&1 | head -c 1200 || true
          echo
          echo "=== converse opus attempts ==="
          for M in anthropic.claude-opus-5-5 anthropic.claude-opus-5-5-v1:0; do
            for R in eu-west-1 us-east-1 us-west-2; do
              echo "-- $M @ $R"
              aws bedrock-runtime converse --region $R --model-id "$M" --messages '[{"role":"user","content":[{"text":"hi"}]}]' --inference-config '{"maxTokens":8}' --output json 2>&1 | head -c 600 || true
              echo
            done
          done
